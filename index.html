<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🌟 Выбери лишнее</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(145deg,#fff4cf,#dff7ff 48%,#eee4ff);color:#29324a;display:flex;align-items:center;justify-content:center;padding:12px;-webkit-tap-highlight-color:transparent}
.game{width:min(900px,100%);background:rgba(255,255,255,.9);border-radius:32px;padding:24px;box-shadow:0 18px 60px rgba(64,67,110,.18)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.title{font-size:clamp(28px,6vw,46px);font-weight:900;color:#6549d8}
.score{font-size:22px;font-weight:900;background:#fff2a8;padding:10px 16px;border-radius:18px}
.progress{height:12px;background:#e8eaf4;border-radius:99px;overflow:hidden;margin-bottom:20px}
.progressbar{height:100%;width:0;background:linear-gradient(90deg,#8d6cff,#31cdb0);transition:.35s}
.counter{text-align:center;color:#7b8299;font-size:17px;font-weight:700}
.question{text-align:center;font-size:clamp(27px,5vw,40px);font-weight:900;margin:7px 0 8px}
.hint{text-align:center;color:#8b91a5;font-size:17px;margin-bottom:20px}
.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.answer{min-height:170px;border:4px solid transparent;border-radius:28px;background:#f7f8fc;color:#30384f;cursor:pointer;font-size:clamp(20px,3vw,28px);font-weight:900;padding:18px;box-shadow:0 7px 0 #dfe2ec;transition:.16s;touch-action:manipulation}
.answer:hover{transform:translateY(-3px)}
.answer:active{transform:translateY(3px);box-shadow:0 3px 0 #dfe2ec}
.answer .emoji{display:block;font-size:64px;margin-bottom:10px}
.answer.correct{background:#dff9ed;border-color:#35c889;box-shadow:0 7px 0 #9ddfbe}
.answer.wrong{background:#ffe1e4;border-color:#f16b7b;box-shadow:0 7px 0 #e7a0a8}
.message{text-align:center;min-height:38px;margin-top:17px;font-size:24px;font-weight:900}
.next,.restart{display:block;margin:10px auto 0;border:0;border-radius:18px;padding:15px 28px;background:#7657e8;color:#fff;font-size:21px;font-weight:900;cursor:pointer;box-shadow:0 6px 0 #5940b9}
.next:active,.restart:active{transform:translateY(3px);box-shadow:0 3px 0 #5940b9}
.hidden{display:none}
.result{text-align:center;padding:50px 10px}
.result .big{font-size:100px}
.result h2{font-size:42px;color:#6549d8;margin:12px}
.result p{font-size:24px;color:#697188}
.stars{font-size:45px;letter-spacing:5px;margin:18px}
@media(max-width:600px){
 body{padding:7px;align-items:flex-start}.game{padding:16px;border-radius:25px;min-height:calc(100vh - 14px)}
 .answers{gap:11px}.answer{min-height:145px;border-radius:21px;padding:10px;font-size:18px;box-shadow:0 5px 0 #dfe2ec}.answer .emoji{font-size:48px}
 .title{font-size:30px}.score{font-size:18px;padding:8px 12px}.question{font-size:28px}
}
</style>
</head>
