<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🌟 Выбери лишнее</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(145deg,#fff4cf,#dff7ff 48%,#eee4ff);color:#29324a;display:flex;align-items:center;justify-content:center;padding:12px;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
.game{width:min(900px,100%);background:rgba(255,255,255,.9);border-radius:32px;padding:24px;box-shadow:0 18px 60px rgba(64,67,110,.18);position:relative}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.title{font-size:clamp(26px,5.5vw,42px);font-weight:900;color:#6549d8}
.right{display:flex;align-items:center;gap:8px}
.score{font-size:22px;font-weight:900;background:#fff2a8;padding:10px 16px;border-radius:18px}
.score.bump{animation:bump .5s}
.iconbtn{border:0;background:#eef0fa;border-radius:16px;width:48px;height:48px;font-size:24px;cursor:pointer;box-shadow:0 4px 0 #d5d9ea;touch-action:manipulation}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #d5d9ea}
.progress{height:12px;background:#e8eaf4;border-radius:99px;overflow:hidden;margin-bottom:20px}
.progressbar{height:100%;width:0;background:linear-gradient(90deg,#8d6cff,#31cdb0);transition:.35s}
.counter{text-align:center;color:#7b8299;font-size:17px;font-weight:700}
.question{text-align:center;font-size:clamp(27px,5vw,40px);font-weight:900;margin:7px 0 8px}
.question.in{animation:slidein .45s}
.hint{text-align:center;color:#8b91a5;font-size:17px;margin-bottom:20px}
.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.answer{min-height:170px;border:4px solid transparent;border-radius:28px;background:#f7f8fc;color:#30384f;cursor:pointer;font-size:clamp(20px,3vw,28px);font-weight:900;padding:18px;box-shadow:0 7px 0 #dfe2ec;transition:transform .16s,background .2s;touch-action:manipulation;opacity:0;animation:popin .45s forwards;position:relative}
.answer:nth-child(2){animation-delay:.08s}.answer:nth-child(3){animation-delay:.16s}.answer:nth-child(4){animation-delay:.24s}
.answer:hover{transform:translateY(-3px)}
.answer:active{transform:translateY(3px);box-shadow:0 3px 0 #dfe2ec}
.answer .emoji{display:block;font-size:64px;margin-bottom:10px}
.answer.correct{background:#dff9ed;border-color:#35c889;box-shadow:0 7px 0 #9ddfbe,0 0 0 8px rgba(53,200,137,.25);animation:happy .8s forwards}
.answer.correct .emoji{animation:spin .8s}
.answer.wrong{background:#ffe1e4;border-color:#f16b7b;box-shadow:0 7px 0 #e7a0a8;animation:shake .55s forwards}
.answer.show{animation:hint 1s .5s 2 forwards}
.message{text-align:center;min-height:38px;margin-top:17px;font-size:24px;font-weight:900}
.message.pop{animation:msg .5s}
.next,.restart{display:block;margin:10px auto 0;border:0;border-radius:18px;padding:15px 28px;background:#7657e8;color:#fff;font-size:21px;font-weight:900;cursor:pointer;box-shadow:0 6px 0 #5940b9;animation:popin .4s}
.next:active,.restart:active{transform:translateY(3px);box-shadow:0 3px 0 #5940b9}
.hidden{display:none}
.result{text-align:center;padding:50px 10px}
.result .big{font-size:100px;display:inline-block;animation:trophy 1.4s infinite}
.result h2{font-size:42px;color:#6549d8;margin:12px}
.result p{font-size:24px;color:#697188}
.stars{font-size:45px;letter-spacing:5px;margin:18px}
.stars span{display:inline-block;animation:popin .5s backwards}
.confetti{position:fixed;pointer-events:none;z-index:50;font-size:30px;animation:fly 1.2s ease-out forwards}
@keyframes popin{0%{opacity:0;transform:scale(.5)}70%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes slidein{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
@keyframes happy{0%{opacity:1;transform:scale(1)}30%{transform:scale(1.15) rotate(-3deg)}60%{transform:scale(.97) rotate(3deg)}100%{opacity:1;transform:scale(1.05)}}
@keyframes spin{0%{transform:scale(1) rotate(0)}50%{transform:scale(1.4) rotate(180deg)}100%{transform:scale(1) rotate(360deg)}}
@keyframes shake{0%,100%{opacity:1;transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(5px)}}
@keyframes hint{0%,100%{opacity:1;transform:scale(1)}50%{opacity:1;transform:scale(1.07)}}
@keyframes bump{0%,100%{transform:scale(1)}40%{transform:scale(1.35) rotate(-5deg)}}
@keyframes msg{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes trophy{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-14px) rotate(5deg)}}
@keyframes fly{0%{transform:translate(0,0) scale(.5);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1.1);opacity:0}}
@media(prefers-reduced-motion:reduce){.answer,.question,.message,.confetti{animation-duration:.01s!important}}
@media(max-width:600px){
 body{padding:7px;align-items:flex-start}.game{padding:16px;border-radius:25px;min-height:calc(100vh - 14px)}
 .answers{gap:11px}.answer{min-height:145px;border-radius:21px;padding:10px;font-size:18px;box-shadow:0 5px 0 #dfe2ec}.answer .emoji{font-size:48px}
 .title{font-size:24px}.score{font-size:18px;padding:8px 12px}.question{font-size:28px}.iconbtn{width:42px;height:42px;font-size:20px}
}
</style>
</head>
<body>
<div class="game">
 <div id="game">
  <div class="top">
   <div class="title">🌟 Выбери лишнее</div>
   <div class="right">
    <button class="iconbtn" id="speak" title="Прочитать вслух">🗣️</button>
    <button class="iconbtn" id="mute" title="Звук">🔊</button>
    <div class="score" id="scorebox">⭐ <span id="score">0</span></div>
   </div>
  </div>
  <div class="progress"><div class="progressbar" id="progress"></div></div>
  <div class="counter" id="counter"></div>
  <div class="question" id="question"></div>
  <div class="hint">Нажми на то, что не подходит 😊</div>
  <div class="answers" id="answers"></div>
  <div class="message" id="message"></div>
  <button class="next hidden" id="next">Дальше ➜</button>
 </div>
 <div id="result" class="result hidden">
  <div class="big">🏆</div><h2>Молодец!</h2><div class="stars" id="stars"></div>
  <p id="resultText"></p><button class="restart" id="restart">🔄 Играть ещё!</button>
 </div>
</div>
<script>
const ROUND=10;

/* ---------- Банк картинок ---------- */
/* Только понятные 4-летнему ребёнку группы. Лишнее всегда из ДРУГОЙ группы (g), чтобы не было спорных ответов */
const CATS={
 animals:{g:'animal',items:["🐶 Собака","🐱 Кошка","🐭 Мышка","🐰 Зайчик","🐻 Медведь","🦊 Лисичка","🐷 Свинка","🐮 Корова","🐴 Лошадь","🐘 Слон","🦁 Лев","🐯 Тигр","🐵 Обезьянка","🐸 Лягушка","🐑 Овечка","🦒 Жираф","🐼 Панда"]},
 sea:{g:'animal',items:["🐟 Рыбка","🐬 Дельфин","🦈 Акула","🐙 Осьминог","🐢 Черепаха","🦀 Краб","🐳 Кит"]},
 fruits:{g:'food',items:["🍎 Яблоко","🍌 Банан","🍐 Груша","🍊 Апельсин","🍓 Клубника","🍇 Виноград","🍉 Арбуз","🍋 Лимон","🍒 Вишня","🍑 Персик"]},
 veggies:{g:'food',items:["🥕 Морковка","🥒 Огурец","🍅 Помидор","🌽 Кукуруза","🥦 Брокколи","🥔 Картошка"]},
 sweets:{g:'food',items:["🍰 Торт","🍪 Печенье","🍦 Мороженое","🍩 Пончик","🍫 Шоколад","🍬 Конфета"]},
 transport:{g:'transport',items:["🚗 Машина","🚌 Автобус","🚕 Такси","🚂 Поезд","✈️ Самолёт","🚁 Вертолёт","🚲 Велосипед","🚜 Трактор","🚒 Пожарная машина","🚑 Скорая","🚀 Ракета"]},
 clothes:{g:'clothes',items:["👕 Футболка","👖 Брюки","👗 Платье","🧦 Носки","🧤 Перчатки","🧣 Шарф","🧢 Кепка","👟 Кроссовки","🧥 Куртка"]},
 toys:{g:'toys',items:["⚽ Мяч","🎈 Шарик","🪁 Змей","🪀 Йо-йо","🎲 Кубик","🧩 Пазл","🪆 Матрёшка"]},
 dishes:{g:'dishes',items:["🍴 Вилка","🥄 Ложка","🍽️ Тарелка","☕ Чашка","🥣 Миска"]}
};

const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function sample(a,n){return shuffle(a).slice(0,n)}
const nameOf=s=>s.slice(s.indexOf(" ")+1);

function wordFor(oddItem,mainCat){
 const animal=(c)=>c&&CATS[c]&&CATS[c].g==='animal';
 return (animal(mainCat)||animal(oddCatOf(oddItem)))?"Кто здесь лишний?":"Что здесь лишнее?";
}
function oddCatOf(item){for(const k in CATS)if(CATS[k].items.includes(item))return k;return null}

/* ---------- Генератор одного задания: три из одной группы + один из другой ---------- */
function makeQuestion(){
 const mainKey=pick(Object.keys(CATS));const main=CATS[mainKey];
 const oddKey=pick(Object.keys(CATS).filter(k=>CATS[k].g!==main.g));
 const three=sample(main.items,3),odd=pick(CATS[oddKey].items);
 const items=three.concat(odd);
 const sh=shuffle(items.map((t,i)=>({t,isOdd:i===3})));
 return {q:wordFor(odd,mainKey),items:sh.map(x=>x.t),correct:sh.findIndex(x=>x.isOdd),odd,
  type:mainKey,key:mainKey+'|'+odd+'|'+three.slice().sort().join(',')};
}

/* ---------- Раунд: 10 разных заданий; помним прошлые раунды ---------- */
function loadRecent(){try{return JSON.parse(localStorage.getItem('lishnee_recent')||'[]')}catch(e){return[]}}
function saveRecent(a){try{localStorage.setItem('lishnee_recent',JSON.stringify(a.slice(-60)))}catch(e){}}
function buildRound(){
 const recent=loadRecent(),keys=new Set(),odds=new Set(),res=[];
 let tries=0;
 while(res.length<ROUND&&tries<3000){
  tries++;const q=makeQuestion();
  const last=res[res.length-1];
  if(keys.has(q.key)||odds.has(q.odd))continue;           // без повторов в раунде
  if(tries<1500&&recent.includes(q.odd))continue;           // стараемся не повторять недавние
  if(last&&last.type===q.type&&tries<2000)continue;         // чтобы типы чередовались
  keys.add(q.key);odds.add(q.odd);res.push(q);
 }
 saveRecent(recent.concat(res.map(q=>q.odd)));
 return res;
}

/* ---------- Звуки (WebAudio, без файлов) ---------- */
let ac=null,soundOn=true;
function ctx(){
 if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
 if(ac&&ac.state==='suspended')ac.resume();return ac;
}
function tone(f,t0,d,type='sine',vol=.25,slideTo){
 const a=ctx();if(!a||!soundOn)return;
 const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;
 o.type=type;o.frequency.setValueAtTime(f,t);if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+d);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);
 o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05);
}
const sfx={
 tap(){tone(520,0,.08,'triangle',.12)},
 correct(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.28,'triangle',.28));tone(1568,.4,.35,'sine',.15)},
 wrong(){tone(330,0,.22,'sine',.22,260);tone(262,.2,.32,'sine',.2,200)},   // мягкий "у-у", не пугающий
 win(){[523,659,784,659,784,1047].forEach((f,i)=>tone(f,i*.13,.3,'triangle',.28));tone(1319,.85,.6,'sine',.2)}
};

/* ---------- Озвучка вопроса (по желанию) ---------- */
function speakText(txt){
 try{if(!soundOn||!window.speechSynthesis)return;
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang='ru-RU';u.rate=.85;u.pitch=1.2;speechSynthesis.speak(u)}catch(e){}
}

/* ---------- Конфетти ---------- */
function confetti(x,y,n=16,set=["🎉","⭐","✨","💛","🎈","🌟"]){
 for(let i=0;i<n;i++){
  const s=document.createElement('span');s.className='confetti';s.textContent=pick(set);
  s.style.left=x+'px';s.style.top=y+'px';
  const ang=Math.random()*Math.PI*2,dist=90+Math.random()*160;
  s.style.setProperty('--dx',Math.cos(ang)*dist+'px');
  s.style.setProperty('--dy',(Math.sin(ang)*dist-60)+'px');
  s.style.setProperty('--rot',(Math.random()*720-360)+'deg');
  document.body.appendChild(s);setTimeout(()=>s.remove(),1300);
 }
}

/* ---------- Игра ---------- */
let questions=[],index=0,score=0,answered=false;
const $=id=>document.getElementById(id);
const PRAISE=["🎉 Правильно! Молодец!","🌟 Умница!","👏 Ура! Верно!","🥳 Отлично!","😍 Super! Правильно!"];
const TRYAGAIN=["💛 Ничего, вот правильный ответ!","🤗 Почти! Смотри, вот лишнее!","💛 Не страшно! Вот правильный ответ!"];

function startRound(){
 questions=buildRound();index=0;score=0;
 $("score").textContent=0;
 $("result").classList.add("hidden");$("game").classList.remove("hidden");
 load();
}
function load(){
 const q=questions[index];answered=false;
 $("counter").textContent=`Задание ${index+1} из ${questions.length}`;
 const qe=$("question");qe.textContent=q.q;qe.classList.remove("in");void qe.offsetWidth;qe.classList.add("in");
 $("answers").innerHTML="";$("message").textContent="";$("message").classList.remove("pop");
 $("next").classList.add("hidden");$("progress").style.width=(index/questions.length*100)+"%";
 q.items.forEach((item,i)=>{
  const b=document.createElement("button");b.className="answer";
  const p=item.indexOf(" ");b.innerHTML=`<span class="emoji">${item.slice(0,p)}</span>${item.slice(p+1)}`;
  b.onclick=()=>choose(i,b);$("answers").appendChild(b);
 });
}
function choose(i,clicked){
 if(answered)return;answered=true;ctx();
 const q=questions[index],bs=[...document.querySelectorAll(".answer")];
 const msg=$("message");
 const r=clicked.getBoundingClientRect();
 if(i===q.correct){
  score++;$("score").textContent=score;
  const sb=$("scorebox");sb.classList.remove("bump");void sb.offsetWidth;sb.classList.add("bump");
  clicked.classList.add("correct");msg.textContent=pick(PRAISE);
  sfx.correct();confetti(r.left+r.width/2,r.top+r.height/2);
 }else{
  clicked.classList.add("wrong");bs[q.correct].classList.add("show","correct");
  msg.textContent=pick(TRYAGAIN);sfx.wrong();
 }
 msg.classList.remove("pop");void msg.offsetWidth;msg.classList.add("pop");
 bs.forEach(b=>b.disabled=true);
 $("progress").style.width=((index+1)/questions.length*100)+"%";
 $("next").textContent=index===questions.length-1?"🏆 Результат":"Дальше ➜";$("next").classList.remove("hidden");
}
$("next").onclick=()=>{sfx.tap();index++;index>=questions.length?finish():load()};
function finish(){
 $("game").classList.add("hidden");$("result").classList.remove("hidden");
 const p=score/questions.length;const s=p>=.9?5:p>=.75?4:p>=.55?3:p>=.3?2:1;
 $("stars").innerHTML=Array.from({length:s},(_,i)=>`<span style="animation-delay:${i*.18}s">⭐</span>`).join("");
 $("resultText").textContent=`Правильных ответов: ${score} из ${questions.length}!`;
 sfx.win();
 for(let k=0;k<4;k++)setTimeout(()=>confetti(innerWidth*(.15+Math.random()*.7),innerHeight*(.2+Math.random()*.3),14),k*250);
}
$("restart").onclick=()=>{ctx();sfx.tap();startRound()};
$("mute").onclick=()=>{
 soundOn=!soundOn;$("mute").textContent=soundOn?"🔊":"🔇";
 if(!soundOn&&window.speechSynthesis)speechSynthesis.cancel();else{ctx();sfx.tap()}
};
$("speak").onclick=()=>{
 ctx();if(!questions[index])return;
 const q=questions[index];speakText(q.q+" "+q.items.map(nameOf).join(", "));
};
/* первое касание "будит" звук на телефонах */
document.addEventListener('pointerdown',()=>ctx(),{once:true});
startRound();
</script>
</body>
</html>
